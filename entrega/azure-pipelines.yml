# Integración continua de ZonaRafaga.
#
# Corre en agentes efímeros de Microsoft: cada etapa arranca en una máquina limpia
# y se destruye al terminar. Así ninguna computadora del equipo es requisito para
# entregar, y lo que pasa en CI no depende de lo que alguien tenga instalado. El
# precio es que el toolchain se declara en `.toolchain`, versión por versión.
#
# No repite la lista de gates: llama a `tools/verificar.mjs`, el mismo script que
# se corre antes de commitear. Local y CI no pueden divergir porque son el mismo
# código.
#
# **Ninguna etapa despliega.** Este proyecto no tiene ambientes: `dev`, `qa` y
# `main` son ramas de integración y verificación, no destinos.

name: $(Date:yyyyMMdd)$(Rev:.r)

# El push no dispara nada. No hay nada que publicar, y mezclar un Pull Request ya
# validado a su rama destino volvería a correr lo mismo sobre el mismo árbol: el
# doble de minutos para la misma respuesta.
trigger: none

# En Azure Repos el bloque `pr:` **se ignora**: lo que encola la validación de un
# Pull Request es la política de compilación de la rama destino, configurada en el
# repositorio. Se deja explícito en `none` porque es lo que la documentación de
# Microsoft recomienda cuando la validación la gobierna la política.
#
# Consecuencia práctica: **el filtro de ruta de los Pull Requests también vive en
# esa política**, no en este archivo.
pr: none

pool:
  vmImage: ubuntu-24.04

resources:
  containers:
    - container: postgres
      image: postgres:17-alpine
      ports:
        - '5432:5432'
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: app
    # El API habla con Redis, y el grafo de Nest lo conecta al arrancar: sin el
    # contenedor, las pruebas de integracion no pasan de la primera.
    - container: redis
      image: redis:7-alpine
      ports:
        - '6379:6379'

variables:
  # Interruptor de compilación del empaquetado. Vacío mientras no exista el
  # registro de imágenes ni su conexión de servicio.
  #
  # Tiene que ser de COMPILACIÓN y no una condición de ejecución, porque **Azure
  # valida las conexiones de servicio y los archivos seguros de TODAS las etapas al
  # compilar, sin mirar sus condiciones**. Una etapa apagada con `condition:` tumba
  # igual la corrida entera si su conexión no existe -- y la tumba antes de pedir
  # agente, así que ni la verificación llega a arrancar.
  - name: REGISTRO_HABILITADO
    value: ''
  - name: baseAfectada
    ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      value: $(System.PullRequest.TargetBranch)
    ${{ else }}:
      value: HEAD~1

stages:
  - stage: Verificacion
    displayName: Verificación
    jobs:
      - job: gates
        displayName: Gates (el mismo script que en local)
        # El nivel gratuito corta un trabajo a los 60 minutos, así que 55 es el
        # techo útil: por encima, el agente lo mata sin dejar reporte.
        timeoutInMinutes: 55
        services:
          postgres: postgres
          redis: redis
        steps:
          - checkout: self
            # Sin historia completa no hay contra qué comparar, y el verificador
            # cae a «no se pudo comparar», que enciende todas las fases.
            fetchDepth: 0
          - template: .pipelines/plantillas/verificacion.yml
            parameters:
              base: $(baseAfectada)

  - ${{ if ne(variables.REGISTRO_HABILITADO, '') }}:
      - stage: Empaquetado
        displayName: Empaquetado
        dependsOn: Verificacion
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        jobs:
          - job: imagen
            displayName: Imagen por versión
            timeoutInMinutes: 55
            steps:
              - template: .pipelines/plantillas/empaquetado.yml
                parameters:
                  registro: zrregistro
                  servidor: zrregistro.azurecr.io
