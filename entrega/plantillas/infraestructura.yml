# La infraestructura se valida en cada entrega; nunca se aplica.
# Aplicar es una acción deliberada, fuera del pipeline.
parameters:
  - name: ambiente
    type: string

steps:
  - template: toolchain.yml

  - task: Cache@2
    displayName: Caché de Terraform
    inputs:
      key: 'terraform | "$(Agent.OS)" | $(versionTerraform)'
      path: $(Agent.ToolsDirectory)/terraform

  - script: |
      set -e
      DESTINO="$(Agent.ToolsDirectory)/terraform"
      if [ ! -x "$DESTINO/terraform" ]; then
        mkdir -p "$DESTINO"
        curl -fsSL -o /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/$(versionTerraform)/terraform_$(versionTerraform)_linux_amd64.zip"
        unzip -o -q /tmp/terraform.zip -d "$DESTINO"
      fi
      echo "##vso[task.prependpath]$DESTINO"
    displayName: Terraform $(versionTerraform)

  - script: |
      set -e
      terraform fmt -recursive -check infra
    displayName: Formato de plantillas

  - script: |
      set -e
      cd infra/ambientes/${{ parameters.ambiente }}
      terraform init -backend=false -input=false
      terraform validate
    displayName: Validación de plantillas

  - script: |
      set -e
      cd infra/ambientes/${{ parameters.ambiente }}
      terraform init -input=false
      terraform plan -input=false -lock=false -out=plan.tfplan
      terraform show -no-color plan.tfplan > $(Build.ArtifactStagingDirectory)/plan-${{ parameters.ambiente }}.txt
    displayName: Plan de cambios
    condition: and(succeeded(), ne(variables['ESTADO_REMOTO'], ''))
    env:
      ARM_USE_AZUREAD: true

  # Un gate que se salta en silencio no es un gate: "no se pudo correr" y "corrió y
  # pasó" se ven idénticos desde fuera, y el segundo es el que la gente asume. El
  # salto está gobernado por entorno, como los tests que necesitan una base real,
  # así que declara su condición en voz alta y en el resumen de la corrida.
  #
  # Importa porque `terraform validate` no es un sustituto: no carga el proveedor,
  # así que no ve argumentos incompatibles ni valores fuera de rango. Un ejemplo
  # real: `health_check_path` sin `health_check_eviction_time_in_min` pasa validate
  # y revienta en plan.
  - script: |
      echo "##vso[task.logissue type=warning]El plan de cambios de '${{ parameters.ambiente }}' NO se ejecutó porque ESTADO_REMOTO está vacío. Lo validado hasta aquí es formato y sintaxis; los errores de proveedor no se han comprobado. Para habilitarlo hacen falta la cuenta de almacenamiento del estado y una conexión de servicio con la que autenticarse."
    displayName: El plan de cambios NO se ejecutó
    condition: and(succeeded(), eq(variables['ESTADO_REMOTO'], ''))

  - publish: $(Build.ArtifactStagingDirectory)
    artifact: infraestructura-${{ parameters.ambiente }}
    displayName: Publicar el plan
    condition: succeededOrFailed()
